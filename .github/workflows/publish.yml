name: Publish to npm

on:
  push:
    tags:
      - "@that-yolanda/*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. @that-yolanda/pi-context)"
        required: true
        type: choice
        options:
          - "@that-yolanda/pi-context"
          - "@that-yolanda/pi-memory-honcho"
          - "@that-yolanda/pi-questionnaire"
          - "@that-yolanda/pi-statusline"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Determine package filter
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "filter=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          else
            # Parse tag: @that-yolanda/pi-context@0.2.0 -> @that-yolanda/pi-context
            tag="${GITHUB_REF_NAME}"
            pkg="${tag%@*}"
            echo "filter=${pkg}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: pnpm --filter "${{ steps.pkg.outputs.filter }}" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
