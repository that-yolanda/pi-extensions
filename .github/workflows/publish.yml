name: Publish to npm

on:
  push:
    tags:
      - "pi-*/v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. @that-yolanda/pi-context)"
        required: true
        type: choice
        options:
          - "@that-yolanda/pi-context"
          - "@that-yolanda/pi-memory-honcho"
          - "@that-yolanda/pi-questionnaire"
          - "@that-yolanda/pi-statusline"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Determine package
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.package }}"
          else
            dir="${GITHUB_REF_NAME%%/*}"
            name="@that-yolanda/${dir}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public
